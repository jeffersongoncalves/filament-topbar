name: Tests

on:
  push:
    branches: [1.x]
  pull_request:
    branches: [1.x]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    name: PHP 8.4 - Laravel 12

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies (Laravel 12)
        run: |
          composer require "laravel/framework:^12.0" "orchestra/testbench:^10.0" "pestphp/pest:^3.0" "pestphp/pest-plugin-laravel:^3.0" --dev --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest --no-coverage
